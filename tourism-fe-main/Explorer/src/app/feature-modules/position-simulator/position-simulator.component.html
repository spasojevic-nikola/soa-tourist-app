<div class="position-simulator-container">
  <div class="header">
    <h2>Position Simulator</h2>
    <p class="description">Click on the map to pin your current location or use the button to detect it automatically.</p>
  </div>

  <div class="controls">
    <button 
      mat-raised-button 
      color="primary" 
      (click)="getCurrentLocation()"
      class="location-btn">
      <mat-icon>my_location</mat-icon>
      Find my location
    </button>
    
    <button 
      mat-raised-button 
      color="warn" 
      (click)="clearPosition()"
      *ngIf="currentPosition"
      class="clear-btn">
      <mat-icon>clear_all</mat-icon>
      Clear position
    </button>
  </div>

   <!-- PRECIZAN UNOS KOORDINATA -->
  <div class="manual-input-section" *ngIf="isMapLoaded">
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <mat-icon>pin_drop</mat-icon>
          Precise coordinate input
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="input-fields">
          <mat-form-field appearance="outline" class="coord-input">
            <mat-label>Latitude</mat-label>
            <input 
              matInput 
              type="number" 
              [(ngModel)]="manualLatitude"
              placeholder="e.g. 45.2671"
              step="0.000001"
              min="-90"
              max="90">
            <span matPrefix>📍 &nbsp;</span>
          </mat-form-field>

          <mat-form-field appearance="outline" class="coord-input">
            <mat-label>Longitude</mat-label>
            <input 
              matInput 
              type="number" 
              [(ngModel)]="manualLongitude"
              placeholder="e.g. 19.8335"
              step="0.000001"
              min="-180"
              max="180">
            <span matPrefix>🌎 &nbsp;</span>
          </mat-form-field>
        </div>
        
        <button 
          mat-raised-button 
          color="accent" 
          (click)="goToManualCoordinates()"
          [disabled]="!manualLatitude || !manualLongitude"
          class="manual-btn">
          <mat-icon>navigation</mat-icon>
          Set exact location
        </button>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="position-info" *ngIf="currentPosition">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Current position</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="coordinates">
          <div class="coordinate">
            <span class="label">Latitude:</span>
            <span class="value">{{ currentPosition.lat | number:'1.6-6' }}</span>
          </div>
          <div class="coordinate">
            <span class="label">Longitude:</span>
            <span class="value">{{ currentPosition.lng | number:'1.6-6' }}</span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="map-container">
    <div id="map" class="map"></div>
  </div>

</div>
