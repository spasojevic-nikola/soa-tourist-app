<h2 mat-dialog-title>Edit Tour</h2>
<mat-dialog-content>
  <form [formGroup]="editForm" class="edit-tour-form">
    <div class="form-group">
      <label>Tour Name</label>
      <input type="text" formControlName="name" class="form-control">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" rows="4" class="form-control"></textarea>
    </div>
    <div class="form-group">
      <label>Difficulty</label>
      <select formControlName="difficulty" class="form-control">
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
        <option value="Expert">Expert</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tags (comma separated)</label>
      <input type="text" formControlName="tags" class="form-control">
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="btn btn-outline" (click)="onCancel()">Cancel</button>
  <button class="btn btn-primary" (click)="onSubmit()" [disabled]="editForm.invalid">Save</button>
</mat-dialog-actions>
